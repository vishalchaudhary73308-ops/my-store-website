<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Store</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      text-align: center;
      background: #f4f6f8;
      color: #222;
    }
    header {
      background: #111827;
      color: white;
      padding: 25px;
    }
    main {
      padding: 60px 20px;
    }
    h1 { font-size: 38px; }
    p { font-size: 18px; }
    a {
      display: inline-block;
      background: #16a34a;
      color: white;
      padding: 14px 24px;
      text-decoration: none;
      border-radius: 6px;
    }
    footer {
      padding: 20px;
      color: #666;
    }
  </style>
</head>
<body>
  <header>
    <h2>MY STORE</h2>
  </header>
  <main>
    <h1>Welcome to My Store!</h1>
    <p>Discover our products and offers.</p>
    <a href="mailto:your-email@example.com">Contact Us</a>
  </main>
  <footer>
    © 2026 My Store
  </footer>
</body>
